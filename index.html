<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport"
        content="width=device-width, initial-scale=1, minimum-scale=1.0, shrink-to-fit=no, viewport-fit=cover">
    <meta name="description" content="AIDE*TOF : Centre d'aide par Thomas O Fredericks">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="MetalManiaFont.css" rel="stylesheet">

    <link rel="stylesheet" href="style.css">

    <!-- Modern PNG favicons -->
    <link rel="icon" type="image/png" href="./favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="shortcut icon" href="./favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./site.webmanifest" />
</head>

<body>

    <!-- Top Search Header -->
    <div class="top-search-container">
        <input type="text" id="search-input" placeholder="Type a search term and press Enter..." autocomplete="off">
        <div id="search-results" class="search-results-dropdown"></div>
    </div>

    <div id="app"></div>

    <script>
        window.$docsify = {
            name: "AidE",
            repo: '',
            relativePath: true,
            unhashtagLinkExtensions: ['.pdf', '.html', '.docx', '.pd', '.maxpat', '.vcv', '.zip'],  // Override file types here
            auto2top: true,
            sidebarDisplayLevel: 0, // set sidebar display level
            loadSidebar: false,    // Enable sidebar loading

            copyCode: {
                buttonText: '📄',
                errorText: '⚠️',
                successText: '✅ ',
            },
            pagination: {
                previousText: 'Précédent',
                nextText: 'Prochain',
                crossChapter: false,
                crossChapterText: true,
            },
            toc: {
                tocMaxLevel: 3,
                target: 'h2, h3',
                insertBefore: false
            }
            ,
            alertStyles: `
            .alert svg { 
                width: 32px; 
                height : 32px;
            }
            `
            ,
            plugins: [
                function (hook, vm) {
                    hook.doneEach(() => {
                        // Site Name
                        let siteName = window.$docsify.name;  // Use the defined name

                        // Try to get the first <h1> from the rendered page content
                        let firstH1 = (document.querySelector('.markdown-section h1'));


                        if (firstH1) {
                            firstH1 = firstH1.innerText.trim();
                            // Set document title
                            document.title = firstH1 + ' @ ' + siteName;
                        } else {
                            let currentTitle = document.title.trim();  // Remove unnecessary spaces

                            // Ensure the site name is not duplicated
                            if (!currentTitle.startsWith(siteName)) {
                                document.title = currentTitle + ' @ ' + siteName;
                            }
                        }


                    });
                }
            ]
        };
    </script>

    <!-- Required -->
    <script src="./_libs/docsify.min.js"></script>

    <!-- Import Mermaid -->
    <script src="./_libs/mermaid.min.js"></script>
    <script src="./_libs/docsify-sidebar-collapse.min.js"></script>
    <script src="./_libs/docsify-mermaid.js"></script>
    <script src="./_libs/docsify-copy-code.min.js"></script>
    <script src="./_libs_modified/docsify-alerts.js"></script>
    <script src="./_libs/docsify-unhashtaglink.js"></script>
    <script src="./_libs_modified/docsify-img-caption.js"></script>

    <!-- Import Prism Languages https://cdn.jsdelivr.net/npm/prismjs@1/components/ -->
    <script src="./_libs/prism-c.js"></script>
    <script src="./_libs/prism-cpp.js"></script>
    <script src="./_libs/prism-csharp.min.js"></script>
    <script src="./_libs/prism-python.js"></script>
    <script src="./_libs/prism-ignore.min.js"></script>
    <script src="./_libs/prism-bash.min.js"></script>
    <script src="./_libs/prism-ini.min.js"></script>
    <script src="./toc.js"></script>
    <script src="./_libs/docsify-route-normalizer.js"></script>

    <!-- Custom Search Index & Submission Logic -->
    <script>
        const autoRedirectSingleResult = false;
        let siteIndex = [];

        // Chargement du JSON optimisé
        fetch('search_index.json')
            .then(response => response.json())
            .then(data => {
                siteIndex = data;
            })
            .catch(error => console.error("Erreur de chargement de l'index :", error));

        const input = document.getElementById('search-input');
        const resultsContainer = document.getElementById('search-results');

        input.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                const query = input.value.toLowerCase().trim();
                if (!query || siteIndex.length === 0) return;

                // Découpe la recherche en mots individuels (ex: "Sérielle Arduino" -> ["sérielle", "arduino"])
                const queryWords = query.split(/\s+/).filter(Boolean);

                // Filtre : retourne les items qui contiennent TOUS les mots recherchés (peu importe l'ordre)
                const matches = siteIndex.filter(item =>
                    queryWords.every(word => item.l.includes(word) || item.u.toLowerCase().includes(word))
                );

                if (matches.length === 1 && autoRedirectSingleResult) {
                    window.location.hash = matches[0].u.replace('#', '');
                    resultsContainer.style.display = 'none';
                    input.value = '';
                } else if (matches.length >= 1) {
                    resultsContainer.innerHTML = matches.map(m => `<a href="${m.u}">${m.t}</a>`).join('');
                    resultsContainer.style.display = 'block';
                } else {
                    resultsContainer.innerHTML = '<div class="search-message">No matching pages found.</div>';
                    resultsContainer.style.display = 'block';
                }
            }
        });

        resultsContainer.addEventListener('click', function (e) {
            if (e.target.tagName === 'A') {
                resultsContainer.style.display = 'none';
                input.value = '';
            }
        });

        document.addEventListener('click', function (e) {
            if (!e.target.closest('.top-search-container')) {
                resultsContainer.style.display = 'none';
            }
        });
    </script>

</body>

</html>
